name: backyard_barrage
description: "Backyard Barrage — seasonal backyard arena game (Flutter + Flame)"
publish_to: 'none'
version: 1.0.0+14

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.1
  flame_audio: ^2.11.14
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/characters/
    - assets/images/characters/enemy/
    - assets/images/characters/player/
    # Ethan's 3D kid: only the 512 frames the game draws (not the 1024s or review sheets).
    - assets/images/characters/player/ethan3d/aim_00_profile_512.png
    - assets/images/characters/player/ethan3d/aim_01_512.png
    - assets/images/characters/player/ethan3d/aim_02_512.png
    - assets/images/characters/player/ethan3d/aim_03_34front_512.png
    - assets/images/characters/player/ethan3d/run_00_flipped_512.png
    - assets/images/characters/player/ethan3d/run_01_flipped_512.png
    - assets/images/characters/player/ethan3d/kid_idle_512.png
    - assets/images/characters/player/ethan3d/kid_throw_follow_512.png
    - assets/images/characters/player/ethan3d/kid_hit_512.png
    - assets/images/characters/player/ethan3d/kid_ko_512.png
    - assets/images/characters/player/ethan3d/kid_aim_away_00_512.png
    - assets/images/characters/player/ethan3d/kid_aim_away_01_512.png
    - assets/images/characters/player/ethan3d/kid_run_00_512.png
    - assets/images/characters/player/ethan3d/kid_run_01_512.png
    - assets/images/characters/player/ethan3d/kid_run_02_512.png
    - assets/images/characters/player/ethan3d/kid_run_03_512.png
    - assets/images/characters/rivals/ghost/
    - assets/images/characters/rivals/frostkid/
    - assets/images/characters/rivals/hellhound/
    - assets/images/characters/rivals/rusher/
    - assets/images/characters/bosses/magma/
    - assets/images/characters/bosses/ogre/
    - assets/images/forts/
    - assets/images/forts/rival/
    - assets/images/projectiles/
    - assets/images/props/
    - assets/images/props/summer/
    - assets/images/props/winter/
    - assets/images/ui/
    - assets/images/ui/powerups/
    - assets/images/ui_modern/
    - assets/images/vfx/
    - assets/images/vfx/boss/
    - assets/images/world/
    - assets/fonts/fredoka/OFL.txt

  # Fredoka (SIL OFL 1.1, assets/fonts/fredoka/OFL.txt). Static instances cut
  # from the google/fonts variable TTF so FontWeight picks real weights.
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/fredoka/Fredoka-Bold.ttf
          weight: 700

