name: backyard_barrage
description: "Backyard Barrage — seasonal backyard arena game (Flutter + Flame)"
publish_to: 'none'
version: 0.1.0+7

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.1
  flame_audio: ^2.11.14
  shared_preferences: ^2.5.5
  google_mobile_ads: ^9.1.0
  app_tracking_transparency: ^2.0.7
  in_app_purchase: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/images/characters/
    - assets/images/characters/enemy/
    - assets/images/characters/player/
    - assets/images/forts/
    - assets/images/projectiles/
    - assets/images/props/
    - assets/images/props/summer/
    - assets/images/props/winter/
    - assets/images/ui/
    - assets/images/ui_modern/
    - assets/images/vfx/
    - assets/images/world/

